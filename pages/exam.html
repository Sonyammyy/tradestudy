<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시험정보 · 무역노트</title>
  <meta name="description" content="국제무역사 1급 스터디 · 시험정보">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/exam.css">
  <script type="module" src="../js/pages/exam.js"></script>
</head>
<body data-page="exam">
  <div id="site-header"></div>
  <div class="app">
    <nav id="site-nav" class="site-nav" aria-label="주요 메뉴"></nav>
    <main id="main" class="page page--exam">
      <div class="page-head">
        <h1 class="page__title">시험정보</h1>
        <p class="caption">제67회 국제무역사 1급 · 한국무역협회 무역아카데미</p>
      </div>

      <div class="exam-top">
        <section class="panel exam-hero" id="exam-hero" aria-label="시험까지 남은 기간"></section>
        <section class="panel" aria-labelledby="rounds-title">
          <header class="panel__head"><h2 id="rounds-title">2026 회차별 일정</h2></header>
          <div class="table-scroll" id="rounds"></div>
        </section>
      </div>

      <div class="exam-grid">
        <section class="panel" aria-labelledby="info-title">
          <header class="panel__head"><h2 id="info-title">시험 개요</h2></header>
          <div class="panel__body" id="exam-info"></div>
        </section>
        <section class="panel" aria-labelledby="check-title">
          <header class="panel__head"><h2 id="check-title">응시 준비물 체크리스트</h2><span class="caption num" id="check-count"></span></header>
          <div class="panel__body" id="checklist"></div>
        </section>
      </div>

      <section class="panel" id="simulator" aria-labelledby="sim-title">
        <header class="panel__head"><h2 id="sim-title">합격 시뮬레이터</h2><span class="caption">과목별 맞힌 개수를 입력하세요 (각 30문항)</span></header>
        <div class="panel__body sim" id="sim"></div>
      </section>

      <section class="panel" aria-labelledby="mock-title">
        <header class="panel__head"><h2 id="mock-title">모의고사 기록</h2><span class="caption" id="mock-count"></span></header>
        <div class="panel__body mock" id="mock"></div>
      </section>
    </main>
  </div>
</body>
</html>
